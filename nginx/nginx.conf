server {
    listen 80;
    server_name _;

    # Docker's built-in DNS server for user-defined networks.
    # Using a variable in proxy_pass makes Nginx re-resolve the name on
    # requests, so it keeps working after the API container is recreated
    # with a new IP address (for example after a Jenkins redeploy).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # "calculator-api" is the Compose service name, not localhost.
        set $upstream http://calculator-api:8080;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
